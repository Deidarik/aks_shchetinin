# Подключение к PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/vocab_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate настройки (ВАЖНО: none, чтобы не трогать твои таблицы!)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ============ JMS / ARTEMIS ============
spring.artemis.mode=embedded
spring.artemis.embedded.enabled=true
spring.artemis.embedded.queues=audit.queue,email.queue

# ============ EMAIL (Gmail пример) ============
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=mikhail.kiravin@gmail.com
spring.mail.password=muhehehe
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

